# Reusable workflow for cutting a STABLE release of a VPS Go service
# (podcast-server, weather-server, sports-server). Sibling of
# go-release.yml, which is for the Pi/OTA services; the differences are
# deliberate and are the whole point of this file:
#
#   - linux/amd64, static (CGO_ENABLED=0, -trimpath): the Hostinger box.
#   - no minisign: nothing on the VPS path verifies a signature — the
#     binary travels the already-trusted CI→SSH channel, and the release
#     exists for provenance and rollback, not OTA.
#   - the private dogserver module is fetched with the org GitHub App.
#
# Per-repo wrapper:
#
#   # .github/workflows/release.yml in a consumer repo
#   name: Release
#   on:
#     workflow_dispatch:
#       inputs:
#         bump_type:
#           type: choice
#           options: [patch, minor, major]
#           required: true
#   concurrency:
#     group: release
#     cancel-in-progress: false
#   jobs:
#     release:
#       uses: MicropleDev/.github/.github/workflows/go-vps-release.yml@main
#       with:
#         binary_name: podcast-server
#         version_pkg: github.com/MicropleDev/podcast-server/pkg/version
#         build_path: ./cmd/server
#         bump_type: ${{ inputs.bump_type }}
#       secrets: inherit
#
# Conventions (see docs/release-scheme.md):
#   - Stable tag form: v{x.y.z}; cut from main only.
#   - Asset: {binary_name}-{version}-linux-amd64 + {asset}.sha256.
#   - prerelease: false.
#   - Version embedded via ldflags into {version_pkg}.Version / GitCommit / BuildDate.
#   - The consumer's deploy.yml triggers on `v*.*.*` tags, so pushing the
#     tag here deploys; rollback = re-run that deploy with an earlier tag.

name: Go VPS service release (stable)

on:
  workflow_call:
    inputs:
      binary_name:
        description: "Output binary name (e.g. 'podcast-server')."
        required: true
        type: string
      version_pkg:
        description: "Go import path of the version package (e.g. 'github.com/MicropleDev/podcast-server/pkg/version')."
        required: true
        type: string
      build_path:
        description: "Go build target relative to repo root (e.g. './cmd/server')."
        required: true
        type: string
      bump_type:
        description: "Semver bump applied to the latest v{x.y.z} tag: patch | minor | major."
        required: true
        type: string
      go_private:
        description: "GOPRIVATE value; also the one module the App token is scoped to."
        required: false
        type: string
        default: github.com/MicropleDev/dogserver
    outputs:
      version:
        description: "Computed version without the 'v' prefix (e.g. '0.2.0')."
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "Computed tag including the 'v' prefix (e.g. 'v0.2.0')."
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write

# One stable cut per (repo, ref) at a time; never cancel one in flight —
# it may already have pushed the tag.
concurrency:
  group: go-vps-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPRIVATE: ${{ inputs.go_private }}

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate bump_type
        run: |
          case "${{ inputs.bump_type }}" in
            patch|minor|major) ;;
            *) echo "::error::bump_type must be patch|minor|major, got '${{ inputs.bump_type }}'"; exit 1 ;;
          esac

      - name: Validate branch is main
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Releases can only be cut from main (got ${{ github.ref_name }})"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # full tag history for version derivation + changelog

      # Idempotency guard: a previous run may have pushed the tag and failed
      # later. Cutting the next version silently would fragment history;
      # the operator resolves it (re-upload assets, or delete and rerun).
      - name: Refuse if HEAD already has a stable tag
        run: |
          set -euo pipefail
          EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            echo "::error::HEAD already has stable tag $EXISTING — refuse to cut another on the same commit."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WEATHER_APP_ID }}
          private-key: ${{ secrets.WEATHER_APP_PRIVATE_KEY }}
          owner: MicropleDev

      - name: Configure Git for the private module
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@${{ inputs.go_private }}".insteadOf "https://${{ inputs.go_private }}"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version (latest v{x.y.z} + bump)
        id: version
        run: |
          set -euo pipefail
          LATEST=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          BASE=${LATEST#v}; BASE=${BASE:-0.0.0}
          IFS='.' read -r MAJ MIN PAT <<<"$BASE"
          case "${{ inputs.bump_type }}" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          VERSION="${MAJ}.${MIN}.${PAT}"
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "git_commit=$(git rev-parse HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Computed stable: v${VERSION} (from base v${BASE}, bump=${{ inputs.bump_type }})"

      - name: Refuse to overwrite an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists — pick a different bump_type."
            exit 1
          fi

      - name: Test (race)
        run: go test -race ./...

      - name: Build linux/amd64 (static)
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ steps.version.outputs.git_commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ASSET="${{ inputs.binary_name }}-${VERSION}-linux-amd64"
          LDFLAGS="-s -w \
            -X '${{ inputs.version_pkg }}.Version=v${VERSION}' \
            -X '${{ inputs.version_pkg }}.GitCommit=${GIT_COMMIT}' \
            -X '${{ inputs.version_pkg }}.BuildDate=${BUILD_DATE}'"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "dist/$ASSET" "${{ inputs.build_path }}"
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create + push tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ inputs.binary_name }} ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate changelog
        run: |
          set -euo pipefail
          PREV=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "${{ steps.version.outputs.tag }}" | sort -V | tail -n1 || true)
          if [ -z "$PREV" ]; then
            CHANGES="Initial release."
          else
            CHANGES=$(git log "${PREV}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "## What's changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Deploy / rollback"
            echo ""
            echo "Pushing this tag triggers the repo's **Deploy to VPS** workflow (linux/amd64)."
            echo "To roll back: re-run **Deploy to VPS** with \`ref\` set to an earlier tag."
          } > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ inputs.binary_name }} ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.build.outputs.asset }}
            dist/${{ steps.build.outputs.asset }}.sha256
